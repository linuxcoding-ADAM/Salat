name: Feature request
description: Suggest an improvement to Salat.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Salat's scope and decisions are recorded in [ARCHITECTURE](https://github.com/linuxcoding-ADAM/Salat/blob/main/docs/ARCHITECTURE.md). A request that conflicts with a recorded decision may be declined, so please skim it first.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that Salat does not let you do well today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like Salat to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, or workarounds you use now.
    validations:
      required: false
