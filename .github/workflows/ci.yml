# CI — every push to main and every PR (§22.1).
#
# Five jobs; all are required checks on main. The pinned toolchain in
# rust-toolchain.toml is what rustup selects on the runner, so every job
# builds with the same compiler the plan pins (§5.4).

name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-features

  build-musl:
    name: musl release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Install cross
        run: cargo install cross --locked
      - run: cross build --release --target x86_64-unknown-linux-musl

  lint-shell:
    name: shellcheck install.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # install.sh ships in Phase 14; until it exists there is nothing to
      # lint, so the job documents the skip instead of failing.
      - name: shellcheck
        run: |
          if [ ! -f install.sh ]; then
            echo "install.sh not present yet (Phase 14); skipping shellcheck"
            exit 0
          fi
          shellcheck install.sh

  supply-chain:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - run: cargo deny check advisories bans licenses sources

  msrv:
    name: MSRV check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      # rust-toolchain.toml pins the channel; rust-version in salat/Cargo.toml
      # is asserted by the build itself.
      - run: cargo check --workspace --all-targets
