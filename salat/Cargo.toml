[package]
name = "salat"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
description = "Prayer times and Adhan for the Linux terminal"
repository = "https://github.com/linuxcoding-ADAM/salat"
publish = false

[dependencies]
async-trait = "0.1.92"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10"
clap = { version = "4.6.6", features = ["derive", "wrap_help"] }
color-eyre = "0.6.5"
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6.0.0"
# §15.2's `events.next()` — crossterm's EventStream is a Stream but
# crossterm does not ship the extension trait; this is the standard
# (and already-transitive, via reqwest) provider.
futures-util = "0.3"
is-terminal = "0.4.17"
ratatui = "0.30"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "gzip", "hickory-dns"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["sqlite", "sqlite-bundled", "runtime-tokio", "migrate", "chrono"] }
thiserror = "2.0.20"
# §16's mandated feature set gains its pieces as the phases that use them
# land: `signal` arrives with Phase 5's SIGINT/SIGTERM/SIGHUP wiring.
tokio = { version = "1.53", features = ["sync", "fs", "time", "macros", "rt-multi-thread", "signal"] }
toml = "1.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
unicode-width = "0.2"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1"
predicates = "3.1.4"
tempfile = "3.27.0"
tokio = { version = "1.53", features = ["test-util"] }
wiremock = "0.6.5"
